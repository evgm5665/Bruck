# modified by eva
# Keeps the puck and companion applications with their required workspace dependencies.

[workspace]
resolver = "3"
# Retain both runtime applications and every local crate they reference.
members = [
    "braid",
    "braid/braid-config-data",
    "braid/braid-run",
    "braid/braid-run/braid_frontend",
    "braid/braid-types",
    "braid/braidz-writer",
    "braid/flydra2",
    "braid/tracking",
    "braidz/braidz-types",
    "camera/ci2",
    "camera/ci2-async",
    "camera/ci2-webcam",
    "camera/strand-cam-remote-control",
    "camera/strand-cam-types",
    "geometry/braid-apriltag-types",
    "geometry/braid-mvg",
    "geometry/camcal",
    "geometry/checkerboard-calibrate",
    "geometry/flydra-mvg",
    "geometry/parry-geom",
    "geometry/refraction",
    "geometry/refraction/bisection-search",
    "geometry/simple-obj-parse",
    "geometry/textured-tri-mesh",
    "im-proc/ads-apriltag",
    "im-proc/fastfreeimage",
    "im-proc/flydra-feature-detector",
    "im-proc/flydra-feature-detector/flydra-feature-detector-types",
    "im-proc/flydra-feature-detector/flydra-pt-detect-cfg",
    "im-proc/imops",
    "im-proc/strand-dynamic-frame",
    "led-box/strand-led-box-comms",
    "media-utils/apriltag-detection-writer",
    "media-utils/bg-movie-writer",
    "media-utils/ffmpeg-rewriter",
    "media-utils/ffmpeg-writer",
    "media-utils/fmf",
    "media-utils/font-drawing",
    "media-utils/frame-source",
    "media-utils/less-avc-wrapper",
    "media-utils/mkv-parser-kit",
    "media-utils/mkv-strand-reader",
    "media-utils/mp4-writer",
    "media-utils/nvenc",
    "media-utils/nvenc/dynlink-cuda",
    "media-utils/nvenc/dynlink-nvidia-encode",
    "media-utils/srt-writer",
    "media-utils/ufmf",
    "media-utils/y4m-writer",
    "strand-cam",
    "strand-cam/strand-cam-csv-config-types",
    "strand-cam/strand-cam-pseudo-cal",
    "strand-cam/strand-cam-storetype",
    "strand-cam/yew_frontend",
    "utils/build-util",
    "utils/download-verify",
    "utils/env-tracing-logger",
    "utils/license-check",
    "utils/strand-cam-enum-iter",
    "utils/strand-datetime-conversion",
    "utils/strand-version-check",
    "utils/strand-withkey",
    "utils/workspace-docs",
    "web/ads-webasm",
    "web/braid-http-session",
    "web/event-stream-types",
    "web/strand-bui-backend-session",
    "web/strand-bui-backend-session/types",
    "web/strand-cam-bui-components",
    "web/strand-cam-bui-types",
    "web/strand-http-video-streaming",
    "web/strand-http-video-streaming/strand-http-video-streaming-types",
]

# Build the puck and companion applications by default.
default-members = ["strand-cam", "braid/braid-run"]

[workspace.package]
version = "1.0.0-rc.6"

[workspace.dependencies]
adskalman = "0.17"
anyhow = "1.0.99"
