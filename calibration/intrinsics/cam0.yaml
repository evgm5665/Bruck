# file added by eva
# Stores cam0 lens parameters for 1280x800 images.

image_width: 1280
image_height: 800
camera_name: cam0
# Focal lengths, principal point and measured skew are expressed in pixels.
camera_matrix:
  rows: 3
  cols: 3
  data: [1113.8391, 3.7792, 635.4631, 0, 1115.0679, 385.6147, 0, 0, 1]
distortion_model: plumb_bob
# Coefficient order is k1, k2, p1, p2, k3.
distortion_coefficients:
  rows: 1
  cols: 5
  data: [-0.4784, 0.3583, 0.0015, 0.0007, -0.1758]
# Identity rectification retains the original image axes.
rectification_matrix:
  rows: 3
  cols: 3
  data: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# This intrinsic projection contains no installed camera position or orientation.
projection_matrix:
  rows: 3
  cols: 4
  data: [1113.8391, 3.7792, 635.4631, 0, 0, 1115.0679, 385.6147, 0, 0, 0, 1, 0]
