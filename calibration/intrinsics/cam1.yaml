# file added by eva
# Stores cam1 lens parameters for 1280x800 images.

image_width: 1280
image_height: 800
camera_name: cam1
# Focal lengths, principal point and measured skew are expressed in pixels.
camera_matrix:
  rows: 3
  cols: 3
  data: [1129.0877, -0.9338, 602.0731, 0, 1131.4793, 441.8773, 0, 0, 1]
distortion_model: plumb_bob
# Coefficient order is k1, k2, p1, p2, k3.
distortion_coefficients:
  rows: 1
  cols: 5
  data: [-0.4402, 0.2038, -0.0017, 0.0023, -0.0429]
# Identity rectification retains the original image axes.
rectification_matrix:
  rows: 3
  cols: 3
  data: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# This intrinsic projection contains no installed camera position or orientation.
projection_matrix:
  rows: 3
  cols: 4
  data: [1129.0877, -0.9338, 602.0731, 0, 0, 1131.4793, 441.8773, 0, 0, 0, 1, 0]
